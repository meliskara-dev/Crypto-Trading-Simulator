spring:
  application:
    name: crypto-trading-simulator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crypto_sim}
    username: ${DB_USERNAME:crypto}
    password: ${DB_PASSWORD:crypto}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
    access-token-ttl: 15m
    refresh-token-ttl: 7d