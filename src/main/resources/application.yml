spring:
  application:
    name: crypto-trading-simulator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crypto_sim}
    username: ${DB_USERNAME:crypto}
    password: ${DB_PASSWORD:crypto}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.meliskara.crypto_trading_simulator.market
  task:
    scheduling:
      pool:
        size: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
    access-token-ttl: 15m
    refresh-token-ttl: 7d